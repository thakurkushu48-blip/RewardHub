<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: white;
            padding: 24px 20px 20px 20px;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }
        .app-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wallet-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .wallet-title {
            font-size: 13px;
            opacity: 0.9;
        }
        .wallet-amount {
            font-size: 26px;
            font-weight: 800;
            margin-top: 2px;
        }
        .limit-info {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .withdraw-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .withdraw-btn:disabled {
            background-color: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.6);
            cursor: not-allowed;
        }
        .task-container {
            padding: 20px 16px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #1e293b;
        }
        .task-card {
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-info h4 {
            font-size: 15px;
            color: #0f172a;
            margin-bottom: 3px;
        }
        .task-info p {
            font-size: 12px;
            color: #64748b;
        }
        .task-status {
            font-size: 12px;
            font-weight: 700;
            margin-top: 4px;
            display: block;
        }
        .btn-start {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            min-width: 75px;
        }
        .btn-start:disabled {
            background-color: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }
    </style>

    <!-- Firebase SDK Compat Version -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="header">
        <div class="app-title">⚡ Reward Hub</div>
        <div class="wallet-card">
            <div>
                <div class="wallet-title">Wallet Balance</div>
                <div class="wallet-amount" id="walletBalance">₹0.00</div>
                <div class="limit-info">Min. Withdrawal: ₹250.00</div>
            </div>
            <button class="withdraw-btn" id="withdrawBtn" onclick="requestWithdrawal()" disabled>Withdraw</button>
        </div>
    </div>

    <div class="task-container">
        <div class="section-title">Today's Automated Tasks</div>
        <div id="taskList"></div>
    </div>

    <script>
        // Exact User Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBDVSalGAeUbSzoVvAILMeTuxwC3eFVRPg",
            authDomain: "rewardhub-f9889.firebaseapp.com",
            databaseURL: "https://rewardhub-f9889-default-rtdb.firebaseio.com",
            projectId: "rewardhub-f9889",
            storageBucket: "rewardhub-f9889.firebasestorage.app",
            messagingSenderId: "866755432543",
            appId: "1:866755432543:web:5d10856a782badb03fcbea",
            measurementId: "G-Q9CLK7H3QE"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let balance = 0.00;
        let completedTasks = {};
        const minWithdrawal = 250.00;

        // Unique device session ID to avoid data conflicts
        let userId = localStorage.getItem('reward_user_id');
        if (!userId) {
            userId = "user_" + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('reward_user_id', userId);
        }

        const tasks = [
            { id: 1, name: "PhonePe", reward: 5.00, url: "https://play.google.com/store/apps/details?id=com.phonepe.app" },
            { id: 2, name: "Paytm", reward: 5.00, url: "https://play.google.com/store/apps/details?id=net.one97.paytm" },
            { id: 3, name: "Google Pay", reward: 5.00, url: "https://play.google.com/store/apps/details?id=com.google.android.apps.nbu.paisa.user" },
            { id: 4, name: "Zomato", reward: 5.00, url: "https://play.google.com/store/apps/details?id=com.application.zomato" },
            { id: 5, name: "Swiggy", reward: 5.00, url: "https://play.google.com/store/apps/details?id=in.swiggy.android" }
        ];

        // Fetch user balance and tasks from Firebase in real-time
        function fetchUserData() {
            db.ref('users/' + userId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.balance !== undefined) {
                        balance = parseFloat(data.balance);
                        updateWalletUI();
                    }
                    if (data.completedTasks) {
                        completedTasks = data.completedTasks;
                    }
                }
                renderTaskList();
            });
        }

        function updateWalletUI() {
            document.getElementById('walletBalance').innerText = `₹${balance.toFixed(2)}`;
            const withdrawBtn = document.getElementById('withdrawBtn');
            withdrawBtn.disabled = balance < minWithdrawal;
        }

        function renderTaskList() {
            const container = document.getElementById('taskList');
            container.innerHTML = "";
            tasks.forEach(task => {
                const isDone = completedTasks[task.id] === true;
                container.innerHTML += `
                    <div class="task-card">
                        <div class="task-info">
                            <h4>${task.name}</h4>
                            <p>Install & Open • Earn ₹${task.reward.toFixed(2)}</p>
                            <span class="task-status" id="timer-${task.id}" style="color: ${isDone ? '#22c55e' : '#f97316'};">
                                ${isDone ? 'Verified!' : ''}
                            </span>
                        </div>
                        <button class="btn-start" id="btn-${task.id}" ${isDone ? 'disabled style="background-color: #e2e8f0; color: #94a3b8;"' : ''} onclick="handleTaskStart(${task.id}, '${task.url}', ${task.reward})">
                            ${isDone ? 'Done' : 'Start'}
                        </button>
                    </div>
                `;
            });
        }

        function handleTaskStart(id, targetUrl, rewardAmount) {
            if (completedTasks[id]) return;

            const btn = document.getElementById(`btn-${id}`);
            const timerSpan = document.getElementById(`timer-${id}`);
            
            btn.disabled = true;
            btn.innerText = "Running";

            // Open app/link in new tab/window
            window.open(targetUrl, '_blank');

            let secondsLeft = 15;
            timerSpan.style.color = '#f97316';
            timerSpan.innerText = `Verifying... ${secondsLeft}s`;

            const timerInterval = setInterval(() => {
                secondsLeft--;

                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    timerSpan.innerText = "Verified!";
                    timerSpan.style.color = "#22c55e";
                    btn.innerText = "Done";
                    btn.style.backgroundColor = "#e2e8f0";
                    btn.style.color = "#94a3b8";

                    // Update local state
                    balance += rewardAmount;
                    completedTasks[id] = true;

                    // Sync instantly to Firebase Realtime Database
                    db.ref('users/' + userId).set({
                        balance: balance,
                        completedTasks: completedTasks
                    });

                    updateWalletUI();
                    alert(`Verification Successful! ₹${rewardAmount.toFixed(2)} added to your wallet.`);
                } else {
                    timerSpan.innerText = `Verifying... ${secondsLeft}s`;
                }
            }, 1000);
        }

        function requestWithdrawal() {
            if (balance >= minWithdrawal) {
                alert("Withdrawal request submitted successfully!");
            } else {
                alert("Minimum withdrawal limit is ₹250.00");
            }
        }

        window.onload = function() {
            fetchUserData();
        };
    </script>
</body>
</html>
